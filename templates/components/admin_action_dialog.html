<dialog id="adminActionDialog" class="admin-action-dialog" aria-labelledby="adminActionTitle" aria-describedby="adminActionMessage">
    <div class="admin-action-dialog-icon" aria-hidden="true"><i class="bi bi-question-circle"></i></div>
    <h2 id="adminActionTitle" tabindex="-1">Confirm action</h2>
    <p id="adminActionMessage"></p>
    <div class="admin-action-dialog-buttons">
        <button type="button" id="adminActionCancel">Cancel</button>
        <button type="button" id="adminActionConfirm">Confirm</button>
    </div>
</dialog>
