{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Please wait | Pio Duran Registration</title>
        <link rel="stylesheet" href="{% static 'css/pages/errors-429.css' %}">
    </head>
    <body>
        <main>
            <div class="icon" aria-hidden="true">
                <svg
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                >
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 2" />
                </svg>
            </div>

            <small>ERROR 429</small>
            <h1>Please slow down</h1>
            <p>
                Too many page requests were made in a short time.
                Wait {{ retry_after }} seconds before trying again.
            </p>

            <a href="{{ request.path }}">Try again</a>
        </main>
    </body>
</html>
